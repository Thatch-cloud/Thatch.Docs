name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@thatch-cloud'

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately not theme:ci. A pull request from a fork gets a token with
      # no access to the private design system, so this step must be allowed to
      # fall back — an outside contributor fixing a typo should still get a green
      # check. Deploy is where the brand build is enforced.
      - name: Build theme
        run: npm run theme

      - name: Build book
        run: mdbook build

      # mdBook is only strict about SUMMARY.md entries. This catches links to
      # pages that were renamed or never written.
      - name: Check internal links
        run: node scripts/check-links.mjs
