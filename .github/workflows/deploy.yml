name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The design system is a private GitHub Packages package. This repo was granted
  # read access to it; without this scope the theme build falls back and fails.
  packages: read

# One deploy at a time, and never cancel one midway — a cancelled deploy can
# leave Pages serving a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@thatch-cloud'

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # npm install, not npm ci: package-lock.json has no entry for the design
      # system (it was generated without registry access), so npm ci would fail on
      # a lockfile that does not match package.json. npm install resolves it here
      # against the Actions token. Switch to npm ci once the lockfile has been
      # regenerated by someone authenticated to GitHub Packages.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --require-brand: fail loudly rather than publish the site in fallback
      # colours if the package could not be installed.
      - name: Build theme from the design system
        run: npm run theme:ci

      - name: Build book
        run: mdbook build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
